name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Test and package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    # No PostgreSQL service and no DB_* variables: persistence is disabled by
    # default, so the full-context tests (@SpringBootTest) start without a
    # database. No .env exists on the runner and THE_ONE_API_ACCESS_TOKEN stays
    # unset: tests mock The One API.
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: backend/pom.xml

      # mvnw is committed without the executable bit (mode 100644).
      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      # verify runs compile, the full test suite and package (jar + Spring Boot
      # repackage); there is no failsafe/integration-test phase, so a separate
      # "mvnw test" step would only run the suite twice.
      - name: Build and test
        run: ./mvnw -B -ntp verify
