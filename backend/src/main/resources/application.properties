# Application name used by Spring Boot for identification and logging.
spring.application.name=wunderlore

# HTTP port. Render injects PORT (10000 by default) and routes traffic to it; locally and in
# Docker Compose PORT is unset, so the backend keeps listening on 8080. Spring Boot binds to
# all interfaces by default, which Render requires (0.0.0.0).
server.port=${PORT:8080}

# Location of the root .env file, one directory above the backend working directory.
springdotenv.directory=..

# Turns on the database layer: DataSource, Hibernate/JPA and Flyway. Off by default, because
# nothing stores data yet, so the backend starts without PostgreSQL and never connects to it.
# Set WUNDERLORE_PERSISTENCE_ENABLED=true once persistence is used. When enabled, an
# unreachable database or a missing DB_PASSWORD fails startup. Applied by
# PersistenceAutoConfigurationFilter.
wunderlore.persistence.enabled=false

# The datasource, JPA and Flyway settings below are only read when persistence is enabled.
# JDBC URL used to connect to PostgreSQL.
# Uses DB_URL from the environment or .env file when defined (e.g. port 5433 for the
# Docker PostgreSQL); falls back to a PostgreSQL installed on the machine (port 5432)
# when DB_URL is undefined.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/wunderlore}

# PostgreSQL username.
# Uses DB_USERNAME from the environment; defaults to postgres if undefined.
spring.datasource.username=${DB_USERNAME:postgres}

# PostgreSQL password.
# Reads DB_PASSWORD from the environment or .env file.
# No default is provided, so the password must be configured when persistence is enabled.
# While it is disabled the placeholder is never resolved, so a missing value is harmless.
spring.datasource.password=${DB_PASSWORD}

# Validates the database schema against the JPA entities without automatically changing it.
spring.jpa.hibernate.ddl-auto=validate

# Disables Open EntityManager in View, avoiding database access during web response rendering.
spring.jpa.open-in-view=false

# Timestamps are written and read as UTC, whatever the time zone of the server.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# The One API base URL used by the backend HTTP client.
the-one-api.base-url=https://the-one-api.dev/v2

# Timeouts for outbound HTTP calls made through the auto-configured RestClient.Builder,
# which The One API client uses. With no other HTTP client library on the classpath,
# Spring Boot uses the JDK HttpClient.
# Connect timeout: maximum time to establish the TCP connection.
# Read timeout: maximum time to wait for the response once the request is sent.
# Override with SPRING_HTTP_CLIENTS_CONNECTTIMEOUT / SPRING_HTTP_CLIENTS_READTIMEOUT.
spring.http.clients.connect-timeout=5s
spring.http.clients.read-timeout=10s

# Access token for authenticated The One API endpoints.
# Reads THE_ONE_API_ACCESS_TOKEN from the environment or .env file.
# Uses an empty string if the variable is missing or empty.
the-one-api.access-token=${THE_ONE_API_ACCESS_TOKEN:}

# Total deadline for one complete lore load (all quote and character pages together).
# When it expires the load is interrupted, its late result is discarded, and the
# failure cooldown starts. Must be positive; ISO-8601 duration.
wunderlore.lore.load-timeout=PT60S

# Global limit on Who Said It round creation (POST /api/games/who-said-it/rounds): at most
# `limit` accepted requests in any `window`, all callers combined, kept in this process only.
# Beyond it the backend answers 429 with Retry-After. Answering rounds is not limited, and a
# round that is answered or expires gives no quota back. `limit` must be 1 to 10000; `window`
# is a duration (60s, 1m, PT1M) and must be positive. With several instances each has its own quota.
wunderlore.rate-limit.round-creation.enabled=true
wunderlore.rate-limit.round-creation.limit=120
wunderlore.rate-limit.round-creation.window=60s

# Lore Challenge matches live in memory only (curated questions, no database and no The One API).
# match-ttl: how long a match is kept, counted from its creation; after it the match is gone (404).
# max-active-matches: matches that are neither finished nor expired; beyond it new matches get 503.
# max-retained-matches: every stored match, finished ones included (kept so their result can be read);
# 0 means twice max-active-matches. About 3 KB per match, so the defaults stay under about 12 MB.
wunderlore.lore-challenge.match-ttl=PT30M
wunderlore.lore-challenge.max-active-matches=2000
wunderlore.lore-challenge.max-retained-matches=0

# Global limit on Lore Challenge match creation (POST /api/games/lore-challenge/matches), same
# mechanism and caveats as the round-creation limit above. Answering and reading are not limited.
wunderlore.rate-limit.match-creation.enabled=true
wunderlore.rate-limit.match-creation.limit=60
wunderlore.rate-limit.match-creation.window=60s

# Who Am I? games live in memory only (curated characters, no database and no The One API).
# game-ttl: how long a game is kept, counted from its creation; after it the game is gone (404).
# max-active-games: games that are neither finished nor expired; beyond it new games get 503.
# max-retained-games: every stored game, finished ones included (kept so their result can be read);
# 0 means twice max-active-games.
wunderlore.who-am-i.game-ttl=PT30M
wunderlore.who-am-i.max-active-games=2000
wunderlore.who-am-i.max-retained-games=0

# Global limit on Who Am I? game creation (POST /api/games/who-am-i/games), same mechanism and
# caveats as the round-creation limit above. Answering and reading are not limited.
wunderlore.rate-limit.who-am-i-game-creation.enabled=true
wunderlore.rate-limit.who-am-i-game-creation.limit=60
wunderlore.rate-limit.who-am-i-game-creation.window=60s

# Where in Middle-earth games live in memory only (curated places, no database and no The One API).
# Same settings as the Who Am I? games above.
wunderlore.where-in-middle-earth.game-ttl=PT30M
wunderlore.where-in-middle-earth.max-active-games=2000
wunderlore.where-in-middle-earth.max-retained-games=0

# Global limit on Where in Middle-earth game creation (POST /api/games/where-in-middle-earth/games),
# same mechanism and caveats as the limits above. Answering and reading are not limited.
wunderlore.rate-limit.where-in-middle-earth-game-creation.enabled=true
wunderlore.rate-limit.where-in-middle-earth-game-creation.limit=60
wunderlore.rate-limit.where-in-middle-earth-game-creation.window=60s

# Who Said It? competitive matches (POST /api/games/who-said-it/matches) live in memory only, built
# from the same lore data as the single-round game. Same settings as the Who Am I? games above.
wunderlore.who-said-it.match-ttl=PT30M
wunderlore.who-said-it.max-active-matches=2000
wunderlore.who-said-it.max-retained-matches=0

# Global limit on Who Said It? match creation, same mechanism and caveats as the limits above.
wunderlore.rate-limit.who-said-it-match-creation.enabled=true
wunderlore.rate-limit.who-said-it-match-creation.limit=60
wunderlore.rate-limit.who-said-it-match-creation.window=60s

# Global limit on publishing a result to the leaderboard (POST /api/ranking/entries), same mechanism
# and caveats as the limits above. Reading the leaderboard is not limited. The leaderboard itself
# is only available when wunderlore.persistence.enabled=true; otherwise it answers 503.
wunderlore.rate-limit.ranking-publish.enabled=true
wunderlore.rate-limit.ranking-publish.limit=60
wunderlore.rate-limit.ranking-publish.window=60s
