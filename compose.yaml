services:
  postgres:
    image: postgres:18
    container_name: wunderlore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-wunderlore}
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in backend/.env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in backend/.env}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
    name: wunderlore-wunderlore-postgres-data
