name: wunderlore

# All variables are read from the root .env file (see .env.example).

services:
  postgres:
    image: postgres:18
    container_name: wunderlore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-wunderlore}
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
    container_name: wunderlore-backend
    restart: unless-stopped
    environment:
      # Inside the Compose network the database is reached by service name,
      # so DB_URL from .env (meant for local runs) is overridden here.
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-wunderlore}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      THE_ONE_API_ACCESS_TOKEN: ${THE_ONE_API_ACCESS_TOKEN:-}
      # Nothing stores data yet, so the backend starts without touching PostgreSQL and does
      # not wait for it. Set to true once persistence is used; the backend then needs the
      # postgres service reachable (add back depends_on with condition: service_healthy).
      WUNDERLORE_PERSISTENCE_ENABLED: ${WUNDERLORE_PERSISTENCE_ENABLED:-false}
    ports:
      # Published on the host loopback only. Containers on the Compose network still reach the
      # backend at backend:8080 and do not go through this mapping.
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"

  # Uncomment when the frontend is ready to be containerized
  # (and fill in the FRONTEND section of .env).
  # frontend:
  #   build:
  #     context: ./frontend
  #   container_name: wunderlore-frontend
  #   restart: unless-stopped
  #   environment:
  #     # Read by the Next.js server; inside the Compose network the backend
  #     # is reached by service name, not localhost.
  #     API_URL: http://backend:8080
  #   ports:
  #     - "${FRONTEND_PORT:-3000}:3000"
  #   depends_on:
  #     - backend

volumes:
  postgres-data:
    name: wunderlore-wunderlore-postgres-data
